<style>
/* Layout: panel de trabajo a la izquierda (pasos 1-4), documento A4 vivo a la derecha */
:root{
  --navy:#1A365D; --orange:#F05A28;
  --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F6F8FB; --line:#D7DEE8; --ink:#16243A; --ink-soft:#5B6B82;
  --accent:#F05A28; --accent-ink:#FFFFFF; --sel:#1A365D; --good:#1E7B4F; --warn:#B4540A; --bad:#B42318;
  --warn-bg:#FFF4E5; --bad-bg:#FDECEA; --good-bg:#E8F5EE;
  --sans:"IBM Plex Sans", "Segoe UI", Arial, sans-serif; --mono:"IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1724; --panel:#172234; --panel-2:#1D2A40; --line:#2C3B55; --ink:#E6ECF5; --ink-soft:#97A6BD;
  --sel:#8FB4E8; --good:#5CC48F; --warn:#F2A65A; --bad:#F27B6E; --warn-bg:#3A2A16; --bad-bg:#3A1C1A; --good-bg:#16352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1724; --panel:#172234; --panel-2:#1D2A40; --line:#2C3B55; --ink:#E6ECF5; --ink-soft:#97A6BD;
  --sel:#8FB4E8; --good:#5CC48F; --warn:#F2A65A; --bad:#F27B6E; --warn-bg:#3A2A16; --bad-bg:#3A1C1A; --good-bg:#16352A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
.app{display:grid;grid-template-columns:minmax(380px,560px) 1fr;height:100vh}
.left{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line)}
.right{overflow:auto;padding:24px}
.topbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.topbar h1{font-size:15px;margin:0 auto 0 0;font-weight:600;letter-spacing:.01em}
.topbar h1 small{display:block;font-weight:400;opacity:.75;font-size:11px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:6px 10px;font:600 12px var(--sans);cursor:pointer}
.seg button.on{background:var(--orange)}
.wrap{padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
.step{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.step>.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);border-radius:8px 8px 0 0}
.step>.hd .n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 11px var(--mono);flex:none}
.step>.hd h2{font-size:13px;margin:0;flex:1;text-transform:uppercase;letter-spacing:.06em}
.step>.bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
label.f{display:flex;flex-direction:column;gap:3px;min-width:0}
label.f>span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
input,select,textarea{font:13px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);text-align:right}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
.chk{display:flex;align-items:center;gap:6px;font-size:12px}
.btn{font:600 12px var(--sans);border-radius:5px;padding:7px 10px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:hover{border-color:var(--sel)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.nav{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:4px 8px;font-size:11px}
.btn.del{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pieza{border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.pieza-hd{display:flex;gap:8px;align-items:center}
.pieza-hd b{font:600 12px var(--mono);background:var(--navy);color:#fff;padding:3px 7px;border-radius:4px}
details.sub{border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
details.sub>summary{cursor:pointer;padding:8px 10px;font-weight:600;font-size:12px;display:flex;gap:8px;align-items:center}
details.sub>summary .tag{margin-left:auto;font:500 11px var(--mono);color:var(--ink-soft)}
details.sub>.in{padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px}
.note{font-size:11px;color:var(--ink-soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.plano{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.plano .mini{background:#fff;border:1px solid var(--line);border-radius:5px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;max-width:100%}
.plano .mini svg{width:100%;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;font-family:var(--mono)}
.var{display:grid;grid-template-columns:22px 1fr;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel)}
.cc{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.cc.cc-off .cc-bd{opacity:.45}
.cc-hd{display:flex;align-items:center;gap:8px}.cc-hd .chk{flex:1;font-size:12.5px}
.cc-cost{font-size:12px;font-weight:600;color:var(--orange);white-space:nowrap}
.cc-bd{display:flex;flex-direction:column;gap:6px}
table.calc tr.off td{color:var(--ink-soft);text-decoration:line-through}
.var.comp{border-left:3px solid var(--navy)}
.var .lt{font:700 12px var(--mono);background:var(--orange);color:#fff;border-radius:4px;height:22px;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 11px var(--sans);border:1px dashed var(--sel);color:var(--sel);background:transparent;border-radius:12px;padding:2px 8px;cursor:pointer}
.alert{font-size:11.5px;border-radius:5px;padding:6px 8px}
.alert.w{background:var(--warn-bg);color:var(--warn)} .alert.b{background:var(--bad-bg);color:var(--bad)} .alert.g{background:var(--good-bg);color:var(--good)}
.tbl-wrap{overflow-x:auto}
table.calc{border-collapse:collapse;width:100%;font-size:11.5px}
table.calc th,table.calc td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap}
table.calc th:first-child,table.calc td:first-child{text-align:left;white-space:normal}
table.calc thead th{background:var(--panel-2);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
table.calc tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
table.calc tr.pvp td{font-weight:700;color:var(--orange)}
table.calc tr.sec td{background:var(--panel-2);font:600 10px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--sel);padding-top:7px}
table.calc tr.edit td{background:var(--warn-bg)}
table.calc .neg{color:var(--bad);font-weight:700}
table.calc input.mg,table.calc select.mg{width:78px;padding:3px 5px;font-size:11.5px}table.calc input.sm2{width:52px}table.calc .over{border-color:var(--orange);border-width:2px}
.mg-gen{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}.mg-gen label{display:flex;gap:4px;align-items:center;font-size:11px;white-space:nowrap}.mg-gen input.mg{width:60px}
table.calc td{font-family:var(--mono)} table.calc td:first-child{font-family:var(--sans)}
.preview-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 16px;max-width:210mm}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.page{background:#fff;color:#1A365D;width:210mm;min-height:297mm;padding:14mm 15mm;box-shadow:0 6px 24px rgba(10,25,50,.18);font-family:Arial,Helvetica,sans-serif;font-size:11px;position:relative}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.hidden{display:none!important}
@media (max-width:1000px){.app{grid-template-columns:1fr;height:auto}.left{border-right:0}.right{padding:16px}.page{transform-origin:top left}}
@media (max-width:520px){.g3,.g4{grid-template-columns:1fr 1fr}.plano{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .left,.preview-bar,.toast{display:none!important}
  .app{display:block;height:auto}.right{padding:0;overflow:visible}
  .pages{gap:0}
  .page{box-shadow:none;margin:0;break-after:page;page-break-after:always;width:210mm;min-height:296mm}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

function buildQuote(){
  const D = S.defaults; const lines = []; const groups = [];
  S.piezas.forEach((p, pi) => {
    const multi = p.variantes.length > 1; const g = {p, pi, lines: []};
    p.variantes.forEach((v, vi) => {
      const c = calcVar(p, v, D); const cant = N(p.cantidad); const pu = c.pvp;
      const sub = pu * cant * (1 - N(v.dto1) / 100) * (1 - N(v.dto2) / 100);
      const desc = (p.descBase || descAuto(p)) + ` Material: ${v.nombre || (c.mt ? matComercial(c.mt) : '[material]')}.`;
      const ln = {ref: (p.ref || 'PZ' + (pi + 1)) + (multi ? '-' + LETTERS[vi] : ''), opt: multi ? LETTERS[vi] : '', desc, pu, dto1: N(v.dto1), dto2: N(v.dto2), cant, sub, pesoG: c.pesoG, imp: S.impPlastico !== 'exento' && p.impuesto && c.pesoG > 0, vi, pi, calc: c};
      ln.tax = ln.imp ? ln.pesoG / 1000 * cant * N(D.tasa) : 0; g.lines.push(ln); lines.push(ln);
    });
    groups.push(g);
  });
  const extras = [];
  S.piezas.forEach((p, pi) => { const pr = p.ref || 'PZ' + (pi + 1); if (p.emb.on && p.emb.modo === 'pedido' && N(p.emb.total) > 0) extras.push({ref: 'EMBALAJE', desc: `${p.emb.desc || 'Embalaje de expedición del pedido'} — ${pr}`, pu: N(p.emb.total), cant: 1, sub: N(p.emb.total), tax: 0, kind: 'emb'}); if (p.tra.on && p.tra.modo === 'pedido' && N(p.tra.precio) > 0) extras.push({ref: 'TRANSPORTE', desc: `${p.tra.desc || 'Transporte del pedido'} — ${pr}`, pu: N(p.tra.precio), cant: 1, sub: N(p.tra.precio), tax: 0, kind: 'tra'}); });
  S.piezas.forEach((p, pi) => { if (p.uti.modo === 'pedido' && (N(p.uti.coste) > 0)) extras.push({ref: 'UTILLAJE', desc: `${p.uti.desc || 'Utillaje'} — ${p.ref || 'PZ' + (pi + 1)}`, pu: N(p.uti.coste), cant: 1, sub: N(p.uti.coste), tax: 0, kind: 'uti'}); });
  S.otros.forEach(o => { if (o.desc || N(o.precio) || o.ref) { const sub = N(o.precio) * N(o.cant); const tax = S.impPlastico !== 'exento' && o.imp && N(o.peso) > 0 ? N(o.peso) / 1000 * N(o.cant) * N(D.tasa) : 0; extras.push({ref: o.ref || '', desc: o.desc, pu: N(o.precio), cant: N(o.cant), sub, tax, pesoG: N(o.peso), kind: 'otro'}); } });
  const portes = S.portes === 'incluido' ? N(S.portesPrecio) : 0;
  const nOpt = Math.max(1, ...S.piezas.map(p => p.variantes.length));
  const extrasSub = extras.reduce((s, e) => s + e.sub, 0), extrasTax = extras.reduce((s, e) => s + e.tax, 0);
  const opts = [];
  for (let k = 0; k < nOpt; k++) {
    let sub = extrasSub, tax = extrasTax; const mats = [];
    groups.forEach(g => { if (!g.lines.length) return; const ln = g.lines[Math.min(k, g.lines.length - 1)]; sub += ln.sub; tax += ln.tax; const v = g.p.variantes[ln.vi]; mats.push(v.nombre || (ln.calc.mt ? matComercial(ln.calc.mt) : '')); });
    const base = sub + portes + tax; const iva = base * N(D.iva) / 100;
    opts.push({k, letter: LETTERS[k], sub, tax, portes, base, iva, total: base + iva, mats: [...new Set(mats)].join(' / ')});
  }

}

<script>
/* =================== ENLACE CON EL PIPELINE ISO-ENVAS (Supabase) ===================
   - Abierto desde la ficha del Pipeline (?cliente=…) arranca un presupuesto nuevo con el cliente cargado
     y el siguiente número correlativo NNNN-MMAA.
   - «Guardar en Pipeline» crea/actualiza el presupuesto en la colección presupuestos (Borrador),
     sube el Word a Documentos de la ficha y guarda el proyecto para poder reeditarlo (?presupuesto=…).
   - «Marcar como enviado» pasa el estado a Enviado: el Pipeline registra el envío en el historial,
     crea el seguimiento a 2 días laborables y sube la ficha a Negociación.
   El presupuestador sigue funcionando igual sin conexión ni sesión. */
(function(){
  'use strict';
  var CFG = {url:'https://rvuoqfsuswjnyytvitqb.supabase.co', key:'sb_publishable_7q_dWNCm_UN3-DNw_cK_Ow_fRYG2s07'};
  var PIPELINE_URL = './';
  var BUCKET = 'documentos';
  var sb = null, session = null, me = {email:'', nombre:''}, busy = false, searchT = null;
  var params = new URLSearchParams(location.search);

  function q(id){ return document.getElementById(id); }
  function rid(n, abc){ var s = '', a = abc || 'abcdefghijklmnopqrstuvwxyz0123456789'; for (var i = 0; i < n; i++) s += a.charAt(Math.floor(Math.random() * a.length)); return s; }
  function isoDate(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function hoy(){ return isoDate(new Date()); }
  function masDias(n){ var d = new Date(); d.setDate(d.getDate() + n); return isoDate(d); }
  function nowIso(){ return new Date().toISOString(); }
  function quien(){ return me.nombre || me.email || 'Presupuestador'; }
  function errTxt(e){ return (e && (e.message || e.error_description)) || String(e); }
  function clienteTxt(c){
    var t = c.empresa || '';
    if (c.direccion) t += '\n' + c.direccion;
    if (c.contacto) t += '\nA/A: ' + c.contacto;
    return t;
  }

  /* ---------- barra ---------- */
  var css = document.createElement('style');
  css.textContent =
    '#pipeBar{max-width:210mm;margin:0 auto 12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px}' +
    '#pipeBar .pbT{font-weight:700;color:var(--sel);margin-right:4px}' +
    '#pipeBar .pbC{font-weight:600}' +
    '#pipeBar .pbS{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--ink-soft)}' +
    '#pipeBar .pbS.env{background:var(--good-bg);color:var(--good)}' +
    '#pipeBar .pbSp{flex:1}' +
    '#pipeBar input{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}' +
    '#pipeBar .pbRes{flex-basis:100%;display:flex;flex-direction:column;gap:4px}' +
    '#pipeBar .pbRes button{text-align:left}' +
    '#pipeBar .pbMsg{flex-basis:100%;color:var(--bad);font-size:12px}' +
    '#pipeBar a{color:var(--sel)}' +
    '@media print{#pipeBar{display:none!important}}';
  document.head.appendChild(css);
  var bar = document.createElement('div'); bar.id = 'pipeBar';
  var right = document.querySelector('main.right');
  if (right) right.insertBefore(bar, right.firstChild);

  function render(msg){
    var P = S && S.pipe;
    if (!sb){ bar.innerHTML = '<span class="pbT">Pipeline</span><span>Sin conexión con el Pipeline: el presupuestador funciona igual, pero no se guarda en la ficha del cliente.</span>'; return; }
    if (!session){
      bar.innerHTML = '<span class="pbT">Pipeline</span><span>Inicia sesión para enlazar el presupuesto con la ficha del cliente.</span>' +
        '<form id="pbLogin" style="display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%">' +
        '<input id="pbE" type="email" autocomplete="username" placeholder="Correo" required style="flex:1 1 180px">' +
        '<input id="pbP" type="password" autocomplete="current-password" placeholder="Contraseña" required style="flex:1 1 140px">' +
        '<button class="btn nav" type="submit">Entrar</button></form>' + (msg ? '<div class="pbMsg">' + esc(msg) + '</div>' : '');
      q('pbLogin').onsubmit = async function(ev){
        ev.preventDefault();
        var r = await sb.auth.signInWithPassword({email: q('pbE').value.trim(), password: q('pbP').value});
        if (r.error){ render(/invalid/i.test(errTxt(r.error)) ? 'Correo o contraseña incorrectos.' : errTxt(r.error)); return; }
        session = r.data.session; await afterLogin();
      };
      return;
    }
    if (!P || !P.clientId){
      bar.innerHTML = '<span class="pbT">Pipeline</span><span>Presupuesto sin cliente vinculado.</span>' +
        '<input id="pbQ" placeholder="Buscar cliente del Pipeline…" style="flex:1 1 200px" autocomplete="off">' +
        '<a href="' + PIPELINE_URL + '" target="_blank" rel="noopener">Abrir Pipeline</a>' +
        '<div class="pbRes" id="pbRes"></div>' + (msg ? '<div class="pbMsg">' + esc(msg) + '</div>' : '');
      q('pbQ').addEventListener('input', function(){ clearTimeout(searchT); var v = this.value; searchT = setTimeout(function(){ buscar(v); }, 300); });
      return;
    }
    var enviado = P.estado && P.estado !== 'Borrador';
    bar.innerHTML = '<span class="pbT">Pipeline</span><span>Cliente: <span class="pbC">' + esc(P.empresa || '') + '</span>' + (P.contacto ? ' · ' + esc(P.contacto) : '') + '</span>' +
      '<span class="pbS' + (enviado ? ' env' : '') + '">' + esc(P.presuId ? (P.estado || 'Borrador') : 'Sin guardar') + '</span>' +
      '<span class="pbSp"></span>' +
      '<button class="btn pri" id="pbSave" type="button"' + (busy ? ' disabled' : '') + '>' + (P.presuId ? 'Actualizar en Pipeline' : 'Guardar en Pipeline') + '</button>' +
      (!enviado ? '<button class="btn nav" id="pbSent" type="button"' + (busy ? ' disabled' : '') + '>Marcar como enviado</button>' : '') +
      (!P.presuId ? '<button class="btn sm" id="pbUnlink" type="button">Cambiar cliente</button>' : '') +
      '<a href="' + PIPELINE_URL + '" target="_blank" rel="noopener">Abrir Pipeline</a>' +
      (msg ? '<div class="pbMsg">' + esc(msg) + '</div>' : '');
    q('pbSave').onclick = function(){ guardar(false); };
    if (q('pbSent')) q('pbSent').onclick = marcarEnviado;
    if (q('pbUnlink')) q('pbUnlink').onclick = function(){ S.pipe = null; save(); render(); };
  }

  /* ---------- clientes ---------- */
  async function buscar(texto){
    var box = q('pbRes'); if (!box) return;
    var r = await sb.rpc('clientes_para_presupuesto', {p_texto: texto || ''});
    if (r.error){ box.innerHTML = '<div class="pbMsg">' + esc(errTxt(r.error)) + '</div>'; return; }
    var rows = (r.data || []).slice(0, 8);
    box.innerHTML = rows.length ? rows.map(function(c, i){ return '<button class="btn sm" type="button" data-i="' + i + '">' + esc(c.empresa || '(sin nombre)') + (c.contacto ? ' · ' + esc(c.contacto) : '') + (c.sector ? ' · ' + esc(c.sector) : '') + '</button>'; }).join('') : '<span style="color:var(--ink-soft)">Sin resultados.</span>';
    box.querySelectorAll('[data-i]').forEach(function(b){ b.onclick = function(){ vincular(rows[+b.dataset.i], false); }; });
  }
  async function datosCliente(id, empresa){
    var r = await sb.rpc('clientes_para_presupuesto', {p_texto: empresa || ''});
    var rows = (r && r.data) || [];
    return rows.find(function(c){ return c.id === id; }) || null;
  }
  async function siguienteNumero(){
    var r = await sb.from('docs').select('data').eq('col', 'presupuestos');
    var max = 0;
    (r.data || []).forEach(function(x){ var m = /^(\d{1,6})-/.exec((x.data && x.data.numero) || ''); if (m) max = Math.max(max, parseInt(m[1], 10)); });
    var d = new Date();
    return String(max + 1).padStart(4, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + String(d.getFullYear()).slice(-2);
  }
  async function vincular(c, nuevo){
    if (nuevo){
      var keepE = S.empresas, keepD = S.defaults, emp = S.empresa, mr = S.matRaw;
      S = defaultState(); S.empresas = keepE; S.defaults = keepD; S.empresa = emp; if (mr) S.matRaw = mr;
    }
    S.pipe = {clientId: c.id, empresa: c.empresa || '', contacto: c.contacto || '', email: c.email || ''};
    S.cliente = clienteTxt(c);
    if (nuevo || /^0001-/.test(S.numero || '')){ try { S.numero = await siguienteNumero(); } catch(e){} }
    renderLeft(); update(); render();
    toast('Presupuesto vinculado a ' + (c.empresa || 'cliente'));
  }

  /* ---------- guardar / enviar ---------- */
  function resumenPiezas(Q){
    var n = S.piezas.map(function(p){ return p.nombre || p.ref; }).filter(Boolean);
    var t = n.length ? n.join(', ') : Q.extras.map(function(x){ return x.desc || x.ref; }).filter(Boolean).slice(0, 3).join(', ');
    if (Q.nOpt > 1) t += ' · ' + Q.nOpt + ' opciones (importe de la opción A)';
    return t.slice(0, 240);
  }
  async function patchDoc(col, id, patch){
    var r = await sb.rpc('patch_doc', {p_col: col, p_id: id, p_patch: patch});
    if (r.error) throw r.error;
  }
  async function guardar(silencioso){
    var P = S.pipe; if (!P || !P.clientId || busy) return false;
    busy = true; render();
    try {
      var Q = buildQuote(), o = Q.opts[0] || {base: 0, total: 0};
      var lineas = Q.lines.map(function(l){ return {ref: l.ref, opcion: l.opt || '', descripcion: l.desc, precioUd: Math.round(l.pu * 10000) / 10000, cantidad: l.cant, subtotal: Math.round(l.sub * 100) / 100}; })
        .concat(Q.extras.map(function(x){ return {ref: x.ref || '', opcion: '', descripcion: x.desc || '', precioUd: Math.round(x.pu * 10000) / 10000, cantidad: x.cant, subtotal: Math.round(x.sub * 100) / 100}; }));
      var snap = JSON.parse(JSON.stringify(S)); delete snap.matRaw; delete snap.pipe;
      // Word del presupuesto → Documentos de la ficha
      var w = await exportWord({blob: true});
      var assetId = rid(24, 'abcdef0123456789');
      var up = await sb.storage.from(BUCKET).upload(assetId, w.blob, {contentType: 'application/msword', upsert: false});
      if (up.error) throw up.error;
      var data = {clientId: P.clientId, numero: S.numero, importe: fNum(o.base, 2), total: fNum(o.total, 2),
        empresaEmisora: S.empresas[S.empresa].nombre, descripcion: resumenPiezas(Q), lineas: lineas,
        validoHasta: masDias(N(S.validez) || 30), docAssetId: assetId, origen: 'Presupuestador Espumas V10', app: snap,
        actualizadoPor: quien(), actualizadoEn: nowIso()};
      var oldAsset = P.docAssetId;
      if (!P.presuId){
        var id = rid(20);
        data.estado = 'Borrador'; data.fecha = hoy(); data.createdAt = nowIso(); data.creadoPor = quien();
        var ins = await sb.from('docs').insert({col: 'presupuestos', id: id, data: data});
        if (ins.error) throw ins.error;
        P.presuId = id; P.estado = 'Borrador';
      } else {
        await patchDoc('presupuestos', P.presuId, data);
      }
      var fileData = {clientId: P.clientId, name: w.name, assetId: assetId, categoria: 'Presupuesto', contentType: 'application/msword',
        sizeBytes: w.blob.size, presupuestoId: P.presuId, subidoPor: quien()};
      if (P.fileRowId){
        await patchDoc('files', P.fileRowId, fileData);
      } else {
        var fid = rid(20); fileData.createdAt = nowIso();
        var fi = await sb.from('docs').insert({col: 'files', id: fid, data: fileData});
        if (fi.error) throw fi.error;
        P.fileRowId = fid;
        await patchDoc('presupuestos', P.presuId, {fileRowId: fid});
      }
      if (oldAsset && oldAsset !== assetId){ try { await sb.storage.from(BUCKET).remove([oldAsset]); } catch(e){} }
      P.docAssetId = assetId;
      save();
      if (!silencioso) toast('Guardado en el Pipeline: presupuesto ' + S.numero + ' y su Word en la ficha del cliente');
      return true;
    } catch(e){
      toast('No se pudo guardar en el Pipeline');
      render('Error al guardar: ' + errTxt(e));
      return false;
    } finally { busy = false; if (q('pbSave')) render(); }
  }
  async function marcarEnviado(){
    var P = S.pipe; if (!P || !P.clientId) return;
    if (!confirm('¿Marcar el presupuesto ' + S.numero + ' como ENVIADO a ' + (P.empresa || 'el cliente') + '?\n\nEl Pipeline lo anotará en el historial, creará el seguimiento a 2 días laborables y pasará la ficha a Negociación.')) return;
    if (!(await guardar(true))) return;
    try {
      await patchDoc('presupuestos', P.presuId, {estado: 'Enviado', fecha: hoy(), enviadoA: P.email || '', estadoCambiadoPor: quien(), estadoCambiadoEn: nowIso()});
      P.estado = 'Enviado'; save(); render();
      toast('Marcado como enviado. Seguimiento creado en el Pipeline.');
      if (P.email && confirm('¿Abrir un correo para ' + P.email + '? Recuerda adjuntar el Word o el PDF (Outlook no permite adjuntarlo automáticamente desde la web).')){
        var asunto = 'Presupuesto ' + S.numero + ' · ' + S.empresas[S.empresa].nombre;
        var cuerpo = 'Buenos días' + (P.contacto ? ' ' + P.contacto.split(' ')[0] : '') + ',\n\nAdjunto le remito nuestro presupuesto nº ' + S.numero + '.\n\nQuedo a su disposición para cualquier aclaración.\n\nUn saludo,\n' + quien();
        location.href = 'mailto:' + encodeURIComponent(P.email) + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo);
      }
    } catch(e){ toast('No se pudo marcar como enviado'); render('Error: ' + errTxt(e)); }
  }

  /* ---------- arranque ---------- */
  async function abrirPresupuesto(id){
    var r = await sb.from('docs').select('data').eq('col', 'presupuestos').eq('id', id).limit(1);
    var d = r.data && r.data[0] && r.data[0].data;
    if (!d){ toast('No se encontró el presupuesto en el Pipeline'); return; }
    if (d.app){
      var mr = S.matRaw;
      S = Object.assign(defaultState(), d.app); if (mr) S.matRaw = mr;
      S.piezas.forEach(normPieza);
    }
    var c = await datosCliente(d.clientId, '') || {};
    S.pipe = {clientId: d.clientId, empresa: c.empresa || '', contacto: c.contacto || '', email: c.email || '',
      presuId: id, estado: d.estado || 'Borrador', docAssetId: d.docAssetId || '', fileRowId: d.fileRowId || ''};
    renderLeft(); update(); render();
    toast('Presupuesto ' + (d.numero || '') + ' abierto desde el Pipeline');
  }
  async function afterLogin(){
    try {
      var r = await sb.from('usuarios_autorizados').select('email,nombre').ilike('email', (session.user.email || '').toLowerCase()).limit(1);
      me = {email: session.user.email || '', nombre: (r.data && r.data[0] && r.data[0].nombre) || ''};
    } catch(e){ me = {email: session.user.email || '', nombre: ''}; }
    var pid = params.get('presupuesto'), cid = params.get('cliente');
    if (pid || cid){
      try {
        if (pid) await abrirPresupuesto(pid);
        else {
          var c = await datosCliente(cid, params.get('empresa') || '') ||
            {id: cid, empresa: params.get('empresa') || '', contacto: params.get('contacto') || '', email: params.get('email') || ''};
          await vincular(c, true);
        }
      } finally {
        // que recargar la página no vuelva a empezar el presupuesto
        try { history.replaceState(null, '', location.pathname); } catch(e){}
      }
    }
    render();
  }
  async function start(){
    if (!window.supabase){ render(); return; }
    try {
      sb = window.supabase.createClient(CFG.url, CFG.key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: false}});
      var s = await sb.auth.getSession();
      session = s.data && s.data.session;
      if (session) await afterLogin(); else render();
    } catch(e){ sb = null; render(); }
  }
  start();
})();
</script>
</body>
</html>
